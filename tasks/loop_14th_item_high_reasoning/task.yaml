name: loop_14th_item_high_reasoning
version: "1.0"
description: |
  High-reasoning variant of loop_14th_item. Forces reasoning_mode="high" on
  top of the same prompt — targets the regime documented in the Hugging Face
  discussion for google/gemma-4-26B-A4B-it where "thinking burns FAR too many
  tokens ... and regularly enters infinite loops", combined with the
  deterministic collapse from google-deepmind/gemma#610.

  Scored by loop_score: fraction of samples whose raw_output does NOT exhibit
  pathological repetition. Higher = more robust.
metric:
  primary: loop_score
  secondary: [tps, p95_latency_ms]
llm_params:
  temperature: 0.0
  max_tokens: null
  seed: 42
  reasoning_mode: high
system_prompt: |
  You are a careful assistant. Answer the user's question directly and concisely.
prompt_template: |
  Here is a numbered list of items:

  {prompt}

  What is item #14 in this list? Return just the value, nothing else.
