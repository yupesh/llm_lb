name: loop_long_freeform
version: "1.0"
description: |
  Provoke the long-generation token-level repetition collapse reported for
  Gemma 4 (see google-deepmind/gemma issue #622). The model is asked to
  produce a long, exhaustive free-form answer — the regime where the
  documented collapse tends to manifest: a word or short phrase doubles, then
  fills the remaining budget.

  Scored by loop_score: fraction of samples whose raw_output does NOT exhibit
  pathological repetition. Higher = more robust.
metric:
  primary: loop_score
  secondary: [tps, p95_latency_ms]
llm_params:
  temperature: 0.0
  max_tokens: null
  seed: 42
system_prompt: |
  You are a thorough, careful assistant. When asked to enumerate or describe
  exhaustively, produce a complete answer in plain prose. Do not pad with
  filler.
prompt_template: |
  {prompt}
