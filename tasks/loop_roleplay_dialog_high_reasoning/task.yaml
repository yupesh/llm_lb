name: loop_roleplay_dialog_high_reasoning
version: "1.0"
description: |
  High-reasoning variant of loop_roleplay_dialog. Forces reasoning_mode="high"
  on top of the same roleplay-continuation prompts — directly targets the
  failure mode reported in huihui-ai/Huihui-gemma-4-26B-A4B-it-abliterated
  discussion #1 (infinite thinking loop during roleplay), stacked with the
  high-reasoning collapse from google/gemma-4-26B-A4B-it discussion #10.

  Scored by loop_score: fraction of samples whose raw_output does NOT exhibit
  pathological repetition. Higher = more robust.
metric:
  primary: loop_score
  secondary: [tps, p95_latency_ms]
llm_params:
  temperature: 0.0
  max_tokens: null
  seed: 42
  reasoning_mode: high
system_prompt: |
  You are a creative-writing assistant participating in a roleplay. Stay in
  character. Produce substantive new content — do not summarise the prior
  dialog, do not break the fourth wall.
prompt_template: |
  {prompt}
