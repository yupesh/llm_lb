name: loop_long_freeform_high_reasoning
version: "1.0"
description: |
  High-reasoning variant of loop_long_freeform. Forces reasoning_mode="high"
  on top of the same exhaustive-enumeration prompts — combines the
  long-generation token-level repetition collapse documented in
  google-deepmind/gemma#622 with the "thinking burns tokens and enters
  infinite loops" regime reported in the Hugging Face discussion for
  google/gemma-4-26B-A4B-it.

  Scored by loop_score: fraction of samples whose raw_output does NOT exhibit
  pathological repetition. Higher = more robust.
metric:
  primary: loop_score
  secondary: [tps, p95_latency_ms]
llm_params:
  temperature: 0.0
  max_tokens: null
  seed: 42
  reasoning_mode: high
system_prompt: |
  You are a thorough, careful assistant. When asked to enumerate or describe
  exhaustively, produce a complete answer in plain prose. Do not pad with
  filler.
prompt_template: |
  {prompt}
